<style>
:root{
  --base:#0c1a2f; --surface:#10223b; --recessed:#0a1628; --lineblue:#3871c1;
  --line:rgba(56,113,193,.45); --text:#f4f7fb; --soft:#c3cfde; --muted:#8ea4c2;
  --accent:#ec9025; --green:#9ac454; --sky:#68bceb; --coral:#f25655; --pink:#d589ca; --violet:#483f66;
  --orange:#ec9025; --amber:#f3a94e; --faint:#8ea4c2; --card:#10223b; --card2:#132a48; --bg2:#0a1628;
  --head:"Barlow Condensed",system-ui,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--base);color:var(--text);font-family:Figtree,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100dvh;background:linear-gradient(180deg,#14284a 0%,var(--base) 38%,var(--base) 100%);}
body::before{content:"";position:fixed;inset:auto 0 0 0;height:60vh;background:url(/brand-packs/regenerate/background_texture_navy.png) center bottom/cover no-repeat;opacity:.55;pointer-events:none;z-index:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.app{max-width:480px;margin:0 auto;min-height:100dvh;position:relative;z-index:1;padding:0 0 calc(120px + var(--safe-b))}
.pad{padding:0 20px}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:calc(var(--safe-t) + 14px) 20px 14px;border-bottom:1px solid rgba(56,113,193,.55);background:linear-gradient(180deg,#14284a,#11223d)}
.hdr img{height:40px}
.bell{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:1.8}
.eyebrow{font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:600}
.eyebrow.grey{color:var(--muted)}
h1{font-family:var(--head);font-weight:500;font-size:34px;line-height:1.05;margin:4px 0 12px;text-transform:uppercase;letter-spacing:.01em}
h2{font-family:var(--head);font-weight:600;font-size:23px;margin:0;text-transform:uppercase;letter-spacing:.02em}
p{margin:0}
.lead{color:var(--soft);font-size:15.5px;line-height:1.55}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
.card.glow{border-color:rgba(236,144,37,.7);background:linear-gradient(160deg,rgba(236,144,37,.16) 0%,var(--surface) 60%)}
.stack>*+*{margin-top:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:999px;background:rgba(236,144,37,.16);color:var(--accent)}
.pill.green{background:rgba(154,196,84,.16);color:var(--green)}
.pill.sky{background:rgba(104,188,235,.16);color:var(--sky)}
.pill.grey{background:var(--recessed);color:var(--soft)}
.btn{display:block;width:100%;text-align:center;padding:15px;border-radius:12px;font-weight:600;font-size:16px;color:#1a1206;background:var(--accent)}
.btn.ghost{background:var(--recessed);color:var(--text);border:1px solid var(--lineblue)}
.btn.outline{background:rgba(255,255,255,.04);color:var(--accent);border:1px solid var(--accent)}
.demo{position:fixed;bottom:calc(76px + var(--safe-b));left:50%;transform:translateX(-50%);z-index:30;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:rgba(10,22,40,.8);color:var(--muted);border:1px solid var(--line);pointer-events:none}
.roamhero{display:block;width:62%;max-width:300px;margin:26px auto 22px}
.hi{white-space:nowrap;font-family:var(--head);font-size:38px;font-weight:600;text-transform:uppercase;margin:0}
.hi em{color:var(--accent)}
.prog{display:flex;align-items:center;gap:10px;margin-top:14px;color:var(--soft);font-size:15.5px;line-height:1.35}
.prog img{width:36px;height:36px;border-radius:8px}
.bar{height:5px;background:rgba(255,255,255,.12);border-radius:5px;overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--accent);border-radius:5px}
.goal{border-radius:18px;overflow:hidden;position:relative;aspect-ratio:1/1;background:url(/patient/goal-placeholder-default.jpg) center/cover;display:grid;place-items:center;font-weight:600;font-size:14px;text-align:center}
.goal::before{content:"";position:absolute;inset:0;background:rgba(150,55,20,.42)}
.goal span{position:relative}
.week{display:flex;gap:6px}
.day{flex:1;border-radius:10px;border:1px solid var(--lineblue);background:var(--recessed);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:9px 0 8px;font-family:var(--head);font-size:14px;font-weight:600;color:var(--soft)}
.day i{font-style:normal;font-size:13px;line-height:1;margin-top:4px}
.day.today{background:var(--accent);border-color:var(--accent);color:#1a1206}
.day.done{border-color:var(--green)}
.srow{display:flex;align-items:center;justify-content:space-between;padding:15px 16px;border:1px solid var(--lineblue);border-radius:12px;background:rgba(10,22,40,.35);width:100%;text-align:left}
.srow .t{font-size:16px;font-weight:500}
.srow .d{font-size:14px;color:var(--soft);margin-top:3px}
.chipst{font-size:13px;font-weight:600;padding:6px 11px;border-radius:999px;background:var(--recessed);color:var(--soft)}
.chipst.today{background:rgba(236,144,37,.2);color:var(--accent)}
.chipst.done{background:rgba(154,196,84,.18);color:var(--green)}
.list-item{display:flex;align-items:center;gap:12px;padding:15px;border-radius:14px;background:var(--surface);border:1px solid var(--line);width:100%;text-align:left}
.lbar{width:4px;align-self:stretch;border-radius:4px;background:var(--accent)}
.grow{flex:1;min-width:0}
.title{font-weight:600;font-size:16px}
.sub{font-size:13.5px;color:var(--soft);margin-top:3px;line-height:1.45}
.meta{font-size:12.5px;color:var(--muted);margin-top:6px}
.chev{color:var(--soft);font-size:20px;line-height:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--recessed);border:1px solid var(--lineblue);border-radius:14px;padding:13px}
.stat b{font-family:var(--head);font-size:30px;display:block;font-weight:600;line-height:1}
.stat span{font-size:13px;color:var(--soft);line-height:1.35;display:block;margin-top:8px}
.dom{border:1px solid var(--lineblue);border-radius:18px;background:var(--surface);overflow:hidden;position:relative;padding:18px 18px 16px 22px;width:100%;text-align:left;display:block}
.dom::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.dom h2{display:flex;align-items:center;gap:10px}
.dom h2 i{width:11px;height:11px;border-radius:50%;background:var(--c)}
.dom .mrow{display:flex;align-items:center;justify-content:space-between;padding:9px 0;font-size:15px}
.dom .mrow b{font-weight:500;margin-left:auto;margin-right:12px;white-space:nowrap}
.dom .mrow b small{color:var(--soft);font-weight:400;font-size:12.5px;margin-left:3px}
.dom hr{border:0;border-top:1px solid var(--lineblue);margin:12px 0 4px}
.ex{display:flex;gap:12px;padding:16px 0;border-bottom:1px solid var(--line)}
.ex:last-child{border-bottom:0}
.num{flex:0 0 28px;height:28px;border-radius:50%;border:1px solid var(--lineblue);display:grid;place-items:center;font-size:12.5px;color:var(--soft)}
.num.done{background:var(--green);color:#0c1a2f;border-color:transparent;font-weight:700}
.dose{color:var(--accent);font-weight:600;font-size:14.5px;white-space:nowrap}
.why{font-size:14px;color:var(--soft);line-height:1.5;margin-top:5px}
.mini{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.chip{font-size:13px;padding:7px 12px;border-radius:999px;border:1px solid var(--lineblue);color:var(--text);background:var(--recessed)}
.section-h{display:flex;align-items:center;justify-content:space-between;margin:24px 0 10px}
.section-h h3{margin:0;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--soft);font-size:14.5px;margin:16px 0 4px}
.big{font-family:var(--head);font-size:54px;font-weight:600;line-height:1}
.big small{font-family:Figtree;font-size:17px;color:var(--soft);font-weight:500;margin-left:6px}
.note{border-left:3px solid var(--accent);padding-left:12px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(12,26,47,.96);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid rgba(56,113,193,.5);padding:6px 4px calc(6px + var(--safe-b))}
.tabs .in{max-width:480px;margin:0 auto;display:flex}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--soft);padding:7px 0 6px;border-radius:12px;min-width:0}
.tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tab.on{background:rgba(236,144,37,.28);color:#fff}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:480px;background:var(--surface);border-top-left-radius:22px;border-top-right-radius:22px;border:1px solid var(--lineblue);padding:20px 20px calc(24px + var(--safe-b));max-height:88dvh;overflow:auto}
.sheet h2{margin-bottom:4px}
.video{position:relative;padding-top:56.25%;border-radius:14px;overflow:hidden;background:#000;margin:12px 0}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.loader{position:fixed;inset:0;z-index:50;background:linear-gradient(180deg,#14284a,var(--base));display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s}
.loader img{width:62%;max-width:300px}
.loader .lp{width:120px;height:3px;border-radius:3px;background:rgba(255,255,255,.12);margin-top:34px;overflow:hidden}
.loader .lp i{display:block;height:100%;width:0;background:var(--accent);animation:load 1.5s ease forwards}
.loader .cap{font-size:13px;color:var(--soft);margin-top:12px}
.loader .foot{position:absolute;bottom:calc(30px + var(--safe-b));font-size:11px;letter-spacing:.2em;color:var(--muted)}
@keyframes load{to{width:100%}}
.fade{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.install{font-size:13px;color:var(--soft);line-height:1.5}
.hexsvg{display:block;width:100%;max-width:440px;margin:6px auto 0;overflow:visible}
.hexsvg g.h{cursor:pointer;transition:transform 650ms cubic-bezier(.65,0,.35,1)}
.teamc{display:flex;gap:14px;align-items:flex-start}
.teamc img{width:64px;height:64px;border-radius:50%;object-fit:cover;border:1px solid var(--lineblue)}
.signoff{text-align:center;margin:34px 0 10px}
.signoff b{font-size:18px;font-weight:600}
/* players */
.player{position:fixed;inset:0;z-index:45;background:linear-gradient(180deg,#14284a,var(--base) 55%);display:flex;flex-direction:column;padding:calc(var(--safe-t) + 18px) 22px calc(26px + var(--safe-b));max-width:480px;margin:0 auto}
.player h1{font-size:30px}
.ring{width:210px;height:210px;margin:26px auto 18px;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--head);font-size:52px;font-weight:600}
.steps{height:4px;display:flex;gap:4px;margin-top:10px}
.steps i{flex:1;border-radius:4px;background:rgba(56,113,193,.4)}
.steps i.d{background:var(--accent)}
.ctrls{display:flex;gap:10px;margin-top:auto}
.ctrls .btn{flex:1}
.orb{width:280px;height:280px;margin:18px auto 6px;position:relative;display:grid;place-items:center}
.orb .halo{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,rgba(236,144,37,.32) 0%,rgba(236,144,37,.10) 45%,rgba(236,144,37,0) 70%);will-change:transform,opacity}
.orb .disc{position:absolute;width:100%;height:100%;border-radius:50%;border:2px solid rgba(243,169,78,.9);background:radial-gradient(circle at 50% 40%,#16305a,#0a1628 72%);box-shadow:0 0 40px rgba(236,144,37,.35),inset 0 0 30px rgba(104,188,235,.12);will-change:transform}
.orb img{position:relative;height:46%;filter:drop-shadow(0 0 14px rgba(236,144,37,.55));will-change:transform}
.phase{text-align:center;font-family:var(--head);text-transform:uppercase;font-size:30px;font-weight:600;margin-top:10px;min-height:36px;letter-spacing:.03em}
.count{text-align:center;font-size:15.5px;color:var(--soft);min-height:22px;margin-top:2px}
.patt{display:inline-flex;gap:6px;margin-top:6px}
</style>
</head>

function trend(m){
  const [a,,c]=m.v; if(a===c) return "steady";
  if(m.better==="higher") return c>a?"up":"down";
  if(m.better==="lower") return c<a?"up":"down";
  const lo = m.olo ?? m.lo, hi = m.ohi ?? m.hi;
  if(lo==null && hi==null) return "steady";
  const dist=(x)=> (lo!=null && x<lo)? lo-x : (hi!=null && x>hi)? x-hi : 0;
  if(dist(a)===dist(c)) return "steady";
  return dist(c)<dist(a)?"up":"down";
}

function spark(m,color){
  const w=64,h=22,vals=m.v,mn=Math.min(...vals),mx=Math.max(...vals),r=(mx-mn)||1;
  const pts=vals.map((v,i)=>[4+i*(w-8)/2, h-4-(v-mn)/r*(h-8)]);
  const t=trend(m), dir = (m.better==="lower" || (m.better==="in_range" && t==="up" && vals[2]<vals[0]));
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${pts.map(p=>p.join(",")).join(" ")}" fill="none" stroke="${color}" stroke-width="1.6"/><circle cx="${pts[2][0]}" cy="${pts[2][1]}" r="2.6" fill="${color}"/></svg>`;
}

function chart(m){
  const W=320,H=190,pl=38,pr=30,pt=20,pb=34;
  let lo=Math.min(...m.v), hi=Math.max(...m.v);
  const bands=[];
  if(m.lo!=null||m.hi!=null){ const a=m.lo??lo-(hi-lo), b=m.hi??hi+(hi-lo); bands.push([a,b,"rgba(104,188,235,.14)"]); }
  if(m.olo!=null||m.ohi!=null){ bands.push([m.olo??lo,m.ohi??hi,"rgba(154,196,84,.16)"]); }
  const pad=(hi-lo||Math.abs(hi)||1)*0.35; lo-=pad; hi+=pad;
  const y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo)); const x=i=>pl+i*(W-pl-pr)/2;
  const clamp=v=>Math.max(pt,Math.min(H-pb,v));
  const bandSvg=bands.map(([a,b,col])=>{const y1=clamp(y(b)),y2=clamp(y(a)); return y2>y1?`<rect x="${pl}" y="${y1}" width="${W-pl-pr}" height="${y2-y1}" fill="${col}"/>`:""}).join("");
  const ticks=[0,1,2,3].map(i=>{const v=lo+(hi-lo)*i/3; return `<text x="${pl-6}" y="${y(v)+3}" text-anchor="end" font-size="9.5" fill="#8ea4c2">${fmt(+v.toFixed(1))}</text>`}).join("");
  const pts=m.v.map((v,i)=>`${x(i)},${y(v)}`).join(" ");
  const area=`${x(0)},${H-pb} ${pts} ${x(2)},${H-pb}`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">
   <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ec9025" stop-opacity=".35"/><stop offset="1" stop-color="#ec9025" stop-opacity="0"/></linearGradient></defs>
   ${bandSvg}${ticks}
   <polygon points="${area}" fill="url(#g)"/>
   <polyline points="${pts}" fill="none" stroke="#ec9025" stroke-width="2.4"/>
   ${m.v.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="${i===2?5.5:4}" fill="${i===2?"#f3a94e":"#0c1a2f"}" stroke="#ec9025" stroke-width="2"/><text x="${x(i)}" y="${y(v)-11}" text-anchor="middle" font-size="11" font-weight="600" fill="#f4f7fb">${fmt(v)}</text><text x="${x(i)}" y="${H-12}" text-anchor="middle" font-size="10" fill="${i===2?"#f4f7fb":"#8ea4c2"}" font-weight="${i===2?600:400}">${TP[i]}</text>`).join("")}
  </svg>`;
}

function breathTick(){

  const el=stepElapsed(); const left=Math.max(0,Math.ceil(m[1]-el));
  let s, label, count="";
  if(pat){
    const cyc=pat.reduce((a,b)=>a+b,0); let tc=el%cyc, ph=0;
    while(tc>=pat[ph] ){ tc-=pat[ph]; ph=(ph+1)%4; }
    const frac=tc/pat[ph];
    s = ph===0? ease(frac) : ph===1? 1 : ph===2? 1-ease(frac) : 0;
    label=PHASES[ph]; count=String(Math.max(1,Math.ceil(pat[ph]-tc)));
    if(ph!==BP.lastPhase){ BP.lastPhase=ph; if(navigator.vibrate&&!BP.paused) try{navigator.vibrate(12)}catch(e){} }

    s = 0.5+0.12*Math.sin(el*2*Math.PI/7); label="Your own pace"; count="Let the breath find its rhythm";

function fitLabels(){ document.querySelectorAll("text.hl").forEach(el=>{ el.style.fontSize="21px"; el.style.letterSpacing="0.05em"; try{ if(el.getComputedTextLength()<=124) return; el.style.letterSpacing="0.01em"; const w=el.getComputedTextLength(); if(w>124) el.style.fontSize=Math.max(12,21*124/w)+"px"; }catch(e){} }); }
function hexMap(items, openKey, onPick){
  const R=100,S=106,W=660,CX=W/2,ROW=Math.sqrt(3)*S*0.5;
  let TOP,H,SL;
  if(items.length===4){ TOP=112+ROW; H=330+ROW; SL=[[CX,TOP-ROW],[CX-1.5*S,TOP],[CX+1.5*S,TOP],[CX,TOP+ROW]]; }
  else { TOP=112; H=330; SL=[[CX-1.5*S,TOP],[CX+1.5*S,TOP],[CX,TOP+ROW]]; }
  const pts=r=>[0,1,2,3,4,5].map(k=>{const a=Math.PI/3*k;return `${(r*Math.cos(a)).toFixed(2)},${(r*Math.sin(a)).toFixed(2)}`}).join(" ");
  const sides=[
    [`M ${CX-2.5*S-22} ${TOP-70} H ${CX-2.5*S+34} L ${CX-2.5*S+56} ${TOP-48}`,[CX-2.5*S-22,TOP-70],0],
    [`M ${CX+2.5*S+26} ${TOP+40} V ${TOP+110} L ${CX+2.5*S+6} ${TOP+130}`,[CX+2.5*S+26,TOP+40],1],
    [`M ${CX-2.5*S-30} ${TOP+150} H ${CX-1.5*S-40}`,[CX-2.5*S-30,TOP+150],0],
    [`M ${CX+1.5*S+30} ${TOP+178} H ${CX+2.5*S+30}`,[CX+2.5*S+30,TOP+178],0]];
  const traces = items.length===4 ? [...sides,[`M ${CX-1.5*S-10} ${TOP-150} H ${CX-S-4} L ${CX-S+14} ${TOP-132}`,[CX-1.5*S-10,TOP-150],1],[`M ${CX+1.5*S+20} ${TOP-156} V ${TOP-110}`,[CX+1.5*S+20,TOP-156],0]]
    : [sides[0],[`M ${CX-0.5*S} ${TOP-96} V ${TOP-40}`,[CX-0.5*S,TOP-96],1],[`M ${CX+0.5*S+18} ${TOP-92} H ${CX+0.5*S+70} L ${CX+0.5*S+92} ${TOP-70}`,[CX+0.5*S+18,TOP-92],0],...sides.slice(1)];
  const order=[...items.filter(i=>i.key!==openKey),items.find(i=>i.key===openKey)];
  const tr=traces.map(([d,dot,alt])=>`<g opacity=".75"><path d="${d}" fill="none" stroke-width="1.2" stroke="${alt?"#68bceb":"#f25655"}"/><circle cx="${dot[0]}" cy="${dot[1]}" r="3.2" fill="${alt?"#68bceb":"#f25655"}"/></g>`).join("");
  const hx=order.map((it,idx)=>{ const [x,y]=SL[idx]; const open=it.key===openKey;
    return `<g class="h" style="transform:translate(${x}px,${y}px)" onclick="${onPick}('${it.key}')">
      <polygon points="${pts(R)}" fill="none" stroke-width="1.4" stroke="rgba(255,255,255,.35)"/>
      <polygon points="${pts(R-8)}" stroke-width="2.4" fill="rgba(8,18,34,.88)" stroke="#fff"/>
      ${open?`<polygon points="${pts(R-8)}" fill="url(#hglow)"/>`:""}
      <polygon points="${pts(R-14)}" fill="none" stroke-width="${open?3:1.8}" stroke="#ec9025" opacity="${open?1:.7}" ${open?'filter="url(#hsoft)"':""}/>
      <text class="hl" x="0" y="${it.line?-10:6}" text-anchor="middle" style="fill:#ec9025;font-family:'Barlow Condensed',sans-serif;font-size:21px;font-weight:600;letter-spacing:.05em">${esc(it.label.toUpperCase())}</text>
      ${it.line?`<text x="0" y="16" text-anchor="middle" style="fill:#fff;font-size:14.5px;font-family:Figtree,system-ui,sans-serif">${esc(it.line)}</text>`:""}
      ${it.meta?`<text x="0" y="37" text-anchor="middle" style="fill:#fff;opacity:.68;font-size:12.5px;font-family:Figtree,system-ui,sans-serif">${esc(it.meta)}</text>`:""}
    </g>`; }).join("");
  return `<svg class="hexsvg" viewBox="0 0 ${W} ${H}"><defs><radialGradient id="hglow" cx=".5" cy=".5" r=".6"><stop offset="0" stop-color="#ec9025" stop-opacity=".26"/><stop offset="1" stop-color="#ec9025" stop-opacity=".02"/></radialGradient><filter id="hsoft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>${tr}${hx}</svg>`;
}

 me:'<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>',
 team:'<svg viewBox="0 0 24 24"><circle cx="9" cy="8.5" r="3.2"/><circle cx="16.5" cy="9.5" r="2.6"/><path d="M3 19c1-3.3 3.4-5 6-5s5 1.7 6 5M15 14.2c2.6-.3 4.8 1.2 5.8 4.3"/></svg>',
 tools:'<svg viewBox="0 0 24 24"><path d="M12 2.8 19.8 7.3v9.4L12 21.2 4.2 16.7V7.3z"/><path d="m8.5 12.5 2.3 2.3 4.7-5"/></svg>'
};
const TABS=[["today","Home"],["programme","Programme"],["passport","Passport"],["tools","Tools"],["me","Me"],["team","Team"]];
function render(){
  let html; const v=state.view;
  if(v&&v.type==="day") html=screenDay(v.d);
  else if(v&&v.type==="domain") html=screenDomain(v.k);
  else if(v&&v.type==="marker") html=screenMarker(v.id);
  else if(v&&v.type==="flow") html=screenFlow(v.i);
  else html={today:screenToday,programme:screenProgramme,tools:screenTools,passport:screenPassport,messages:screenMessages,me:screenMe,team:screenTeam}[state.tab]();
  $("#app").innerHTML=`<div class="fade">${html}</div>`;
  fitLabels(); if(document.fonts) document.fonts.ready.then(fitLabels).catch(()=>{});
  $("#tabs").innerHTML=TABS.map(([k,l])=>`<button class="tab ${state.tab===k?"on":""}" onclick="go('${k}')">${ICONS[k]}${l}</button>`).join("");
}
render();
setTimeout(()=>{const l=$("#loader"); l.style.opacity=0; setTimeout(()=>l.remove(),500);},1700);
if("serviceWorker" in navigator){ window.addEventListener("load",()=>navigator.serviceWorker.register("/roam-demo/sw.js",{scope:"/roam-demo/"}).catch(()=>{})); }
</script>
</body>
