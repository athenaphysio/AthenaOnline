<style>
:root{
  --bg:#120c08; --bg2:#1b130d; --card:#211710; --card2:#2a1d14; --line:#3a2a1d;
  --text:#f6efe8; --muted:#b9a99a; --faint:#8a7a6b;

  --rust:#c9583a;

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100dvh;background:radial-gradient(120% 60% at 50% -10%,#3a2008 0%,var(--bg) 60%) fixed}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.app{max-width:480px;margin:0 auto;min-height:100dvh;position:relative;padding:calc(var(--safe-t) + 14px) 18px calc(124px + var(--safe-b))}

h2{font-size:20px;margin:0 0 6px;font-weight:600}
p{margin:0}
.lead{color:var(--muted);font-size:14.5px;line-height:1.5}
.card{background:linear-gradient(180deg,var(--card) 0%,var(--bg2) 100%);border:1px solid var(--line);border-radius:18px;padding:16px}
.stack>*+*{margin-top:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:999px;background:rgba(247,147,30,.16);color:var(--amber)}
.pill.green{background:var(--greenbg);color:var(--green)}
.pill.grey{background:rgba(255,255,255,.07);color:var(--muted)}
.btn{display:block;width:100%;text-align:center;padding:14px;border-radius:14px;font-weight:600;font-size:15.5px;color:#1a0f05;background:linear-gradient(180deg,var(--amber),var(--orange) 55%,var(--orange2));box-shadow:0 6px 22px rgba(247,147,30,.28)}
.btn.ghost{background:rgba(255,255,255,.06);color:var(--text);box-shadow:none;border:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.top img{height:30px}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:700;color:var(--orange);border:1px solid rgba(247,147,30,.5);background:rgba(247,147,30,.08)}
.demo{position:fixed;bottom:calc(66px + var(--safe-b));left:50%;transform:translateX(-50%);z-index:30;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:rgba(0,0,0,.55);color:var(--faint);border:1px solid var(--line);pointer-events:none}
.week{display:flex;gap:6px;justify-content:space-between}
.day{flex:1;aspect-ratio:1/1.12;border-radius:12px;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--muted);position:relative;background:rgba(255,255,255,.02)}
.day .dot{width:5px;height:5px;border-radius:50%;background:var(--orange);margin-top:5px}
.day.rest{color:var(--faint);opacity:.6}
.day.today{background:linear-gradient(180deg,var(--amber),var(--orange2));color:#1a0f05;border-color:transparent}
.day.today .dot{background:#1a0f05}
.day.done::after{content:"";position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--green)}
.list-item{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--line);width:100%;text-align:left}
.bar{width:4px;align-self:stretch;border-radius:4px;background:var(--orange)}
.grow{flex:1;min-width:0}
.title{font-weight:600;font-size:15.5px}
.sub{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.4}
.chev{color:var(--faint);font-size:20px;line-height:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{font-size:24px;display:block;font-weight:700}
.stat span{font-size:11.5px;color:var(--muted);line-height:1.3;display:block;margin-top:2px}
.ex{display:flex;gap:12px;padding:16px 0;border-bottom:1px solid var(--line)}

.num{flex:0 0 26px;height:26px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:12px;color:var(--muted)}
.num.done{background:var(--green);color:#08130c;border-color:transparent;font-weight:700}
.dose{color:var(--orange);font-weight:600;font-size:14px;white-space:nowrap}
.why{font-size:13.5px;color:var(--muted);line-height:1.5;margin-top:5px}
.meta{font-size:12px;color:var(--faint);margin-top:6px}
.mini{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.chip{font-size:12.5px;padding:7px 11px;border-radius:999px;border:1px solid var(--line);color:var(--text);background:rgba(255,255,255,.03)}

.section-h h3{margin:0;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:600}

.note{border-left:3px solid var(--orange);padding-left:12px}
.quote{font-size:16px;font-weight:600;line-height:1.45}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(18,12,8,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 0 calc(8px + var(--safe-b))}

.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--faint);padding:4px 0}

.loader .prog{width:120px;height:3px;border-radius:3px;background:var(--line);margin-top:34px;overflow:hidden}
.loader .prog i{display:block;height:100%;width:0;background:var(--orange);animation:load 1.5s ease forwards}
.loader .cap{font-size:12.5px;color:var(--muted);margin-top:12px}
.loader .foot{position:absolute;bottom:calc(30px + var(--safe-b));font-size:10.5px;letter-spacing:.2em;color:var(--faint)}
@keyframes load{to{width:100%}}
.fade{animation:fade .25s ease}

.install{font-size:12.5px;color:var(--muted);line-height:1.5}
.findings .list-item{cursor:default}
.hexes{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;margin:18px auto 6px;max-width:340px}
.hex{aspect-ratio:1/0.9;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);background:linear-gradient(180deg,var(--card2),var(--bg2));display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 18%;position:relative}
.hex::before{content:"";position:absolute;inset:1.5px;clip-path:inherit;background:linear-gradient(180deg,#2a1d14,#1b130d);z-index:-1}
.hex:nth-child(odd){transform:translateY(0)}.hex:nth-child(even){transform:translateY(46%)}
.hexes{padding-bottom:84px}
.hex.on::before{display:none}
.hex b{font-size:14.5px;font-weight:600;line-height:1.2}
.hex span{font-size:11px;color:var(--muted);margin-top:4px}
.hex em{font-style:normal;font-size:10.5px;color:var(--orange);margin-top:6px;font-weight:600}
.hex.on{background:linear-gradient(180deg,var(--amber),var(--orange2))}
.hex.on b,.hex.on span,.hex.on em{color:#1a0f05}
.player{position:fixed;inset:0;z-index:45;background:radial-gradient(90% 60% at 50% 35%,#2b1706 0%,var(--bg) 70%);display:flex;flex-direction:column;padding:calc(var(--safe-t) + 18px) 22px calc(26px + var(--safe-b));max-width:480px;margin:0 auto}
.ring{width:210px;height:210px;margin:26px auto 18px;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;font-size:46px;font-weight:700}
.steps{height:4px;display:flex;gap:4px;margin-top:8px}
.steps i{flex:1;border-radius:4px;background:var(--line)}
.steps i.d{background:var(--orange)}
.ctrls{display:flex;gap:10px;margin-top:auto}
.ctrls .btn{flex:1}
</style>
</head>

const weekNo = Math.min(CLIENT.weeks, Math.max(1, Math.floor((today-startD)/(7*864e5))+1));
const state = { tab:"today", view:null, done:{}, noticed:{} };

function duration(day){ let n=0; DAYS[day].blocks.forEach(b=>n+=BLOCKS[b].items.length); return Math.max(10, Math.round(n*3/5)*5); }
function moves(day){ let n=0; DAYS[day].blocks.forEach(b=>n+=BLOCKS[b].items.length); return n; }
function dose(it){ const [, ,sets,reps,hold]=it; if(hold) return `${sets} × ${hold}s`; if(reps===1) return `${sets} × 1 length`; return sets>1?`${sets} × ${reps}`:`${reps} reps`; }
function nextSessionDay(from){ for(let i=1;i<=7;i++){ const d=((from-1+i)%7)+1; if(DAYS[d]) return d; } return 1; }
const DAYNAME=["","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
function greet(){ const h=today.getHours(); return h<12?"Good morning":h<18?"Good afternoon":"Good evening"; }

function spark(m,color){
  const w=64,h=22,vals=m.v,mn=Math.min(...vals),mx=Math.max(...vals),r=(mx-mn)||1;
  const pts=vals.map((v,i)=>[4+i*(w-8)/2, h-4-(v-mn)/r*(h-8)]);
  const t=trend(m), dir = (m.better==="lower" || (m.better==="in_range" && t==="up" && vals[2]<vals[0]));
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${pts.map(p=>p.join(",")).join(" ")}" fill="none" stroke="${color}" stroke-width="1.6"/><circle cx="${pts[2][0]}" cy="${pts[2][1]}" r="2.6" fill="${color}"/></svg>`;
}

/* ===== Screens ===== */

  <div class="eyebrow">Week ${weekNo} of ${CLIENT.weeks}</div>

  <div class="section-h"><h3>Updates</h3></div>
  <button class="list-item" onclick="go('passport')">
    <div class="avatar" style="border-radius:12px;width:40px;height:40px">♥</div>
    <div class="grow"><div class="title">Your passport has updated</div><div class="sub">Your six month results are in, with ${improving} markers improving since baseline and notes from your care team.</div></div>
    <span class="chev">›</span></button>

function screenDay(d){
  const s=DAYS[d]; let n=0;
  const body = s.blocks.map(bk=>{
    const B=BLOCKS[bk];
    return `<div class="section-h"><h3>${B.label}</h3></div>` + B.items.map((it,j)=>{
      n++; const key=`${d}:${bk}:${j}`; const done=state.done[key];
      return `<div class="ex">
        <button class="num ${done?"done":""}" onclick="toggleEx('${key}',${d})" aria-label="Mark done">${done?"✓":n}</button>
        <div class="grow">
          <div class="row between" style="align-items:flex-start"><div class="title">${esc(it[0])}</div><div class="dose">${dose(it)}</div></div>

  <div class="row" style="gap:8px"><span class="pill green">Stage 1 of 3</span><span class="pill">${duration(d)} min</span></div>

  ${body}
  <button class="btn" style="margin-top:18px" onclick="finishDay(${d})">${state.done[d]?"Practice recorded":"Finish today's practice"}</button>`;
}

function chart(m){
  const W=320,H=190,pl=38,pr=30,pt=20,pb=34;
  let lo=Math.min(...m.v), hi=Math.max(...m.v);
  const bands=[];
  if(m.lo!=null||m.hi!=null){ const a=m.lo??lo-(hi-lo), b=m.hi??hi+(hi-lo); bands.push([a,b,"rgba(247,147,30,.10)"]); }
  if(m.olo!=null||m.ohi!=null){ bands.push([m.olo??lo,m.ohi??hi,"rgba(92,201,138,.12)"]); }
  const pad=(hi-lo||Math.abs(hi)||1)*0.35; lo-=pad; hi+=pad;
  const y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo)); const x=i=>pl+i*(W-pl-pr)/2;
  const clamp=v=>Math.max(pt,Math.min(H-pb,v));
  const bandSvg=bands.map(([a,b,col])=>{const y1=clamp(y(b)),y2=clamp(y(a)); return y2>y1?`<rect x="${pl}" y="${y1}" width="${W-pl-pr}" height="${y2-y1}" fill="${col}"/>`:""}).join("");
  const ticks=[0,1,2,3].map(i=>{const v=lo+(hi-lo)*i/3; return `<text x="${pl-6}" y="${y(v)+3}" text-anchor="end" font-size="9.5" fill="#8a7a6b">${fmt(+v.toFixed(1))}</text>`}).join("");
  const pts=m.v.map((v,i)=>`${x(i)},${y(v)}`).join(" ");
  const area=`${x(0)},${H-pb} ${pts} ${x(2)},${H-pb}`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">
   <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7931e" stop-opacity=".35"/><stop offset="1" stop-color="#f7931e" stop-opacity="0"/></linearGradient></defs>
   ${bandSvg}${ticks}
   <polygon points="${area}" fill="url(#g)"/>
   <polyline points="${pts}" fill="none" stroke="#f7931e" stroke-width="2.4"/>
   ${m.v.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="${i===2?5.5:4}" fill="${i===2?"#ffb547":"#120c08"}" stroke="#f7931e" stroke-width="2"/><text x="${x(i)}" y="${y(v)-11}" text-anchor="middle" font-size="11" font-weight="600" fill="#f6efe8">${fmt(v)}</text><text x="${x(i)}" y="${H-12}" text-anchor="middle" font-size="10" fill="${i===2?"#f6efe8":"#8a7a6b"}" font-weight="${i===2?600:400}">${TP[i]}</text>`).join("")}
  </svg>`;
}

  return `<button class="back" onclick="closeView()">‹ ${label}</button>
  <h1>${esc(m.name)}</h1>
  <div class="big">${fmt(m.v[2])}<small>${esc(m.unit)}</small></div>
  <div class="row" style="margin:6px 0 16px"><span class="pill ${t==="up"?"green":t==="steady"?"grey":""}">${t==="up"?"Improving":t==="steady"?"Steady":"Worth a conversation"}</span><span class="sub" style="margin:0">From ${fmt(m.v[0])} ${esc(m.unit)} at baseline</span></div>
  <div class="card">${chart(m)}${legend?`<div class="row sub" style="gap:16px;margin-top:8px">${legend}</div>`:""}</div>
  ${m.exp?`<div class="card" style="margin-top:12px"><div class="eyebrow" style="color:var(--faint)">What this measures</div><p class="lead" style="margin-top:8px;font-size:14px">${esc(m.exp)}</p></div>`:""}
  ${m.note?`<div class="card" style="margin-top:12px"><div class="eyebrow" style="color:var(--faint)">From your care team</div><p class="lead note" style="margin-top:10px;color:var(--text);font-size:14.5px">${esc(m.note)}</p></div>`:""}`;
}

const AREA_STATE={area:"breath"};
function mins(moves){ const s=moves.reduce((a,m)=>a+m[1],0); return Math.max(1,Math.round(s/60)); }
function screenTools(){
  const A=window.TOOL_AREAS, F=window.TOOL_FLOWS, open=A.find(a=>a.key===AREA_STATE.area);
  const list=F.map((f,i)=>({f,i})).filter(x=>x.f[1]===open.key);
  return `${header()}
  <div class="eyebrow">Tools</div>
  <h1>Tools</h1>
  <p class="lead">Resources to use whenever you need them, alongside your programme. Choose an area, then a practice.</p>
  <div class="hexes">${A.map(a=>`<button class="hex ${a.key===open.key?"on":""}" onclick="pickArea('${a.key}')"><b>${a.label}</b><span>${a.line}</span><em>${F.filter(f=>f[1]===a.key).length} ready</em></button>`).join("")}</div>
  <p class="lead" style="font-size:14px">${open.detail}</p>
  <div class="stack" style="margin-top:14px">${list.map(({f,i})=>`<button class="list-item" onclick="openFlow(${i})"><div class="bar"></div><div class="grow"><div class="title">${esc(f[0])}</div><div class="sub">${esc(f[2])}</div><div class="meta">${mins(f[3])} minutes · ${f[3].length} steps</div></div><span class="chev">▶</span></button>`).join("")}</div>`;
}
function pickArea(k){ AREA_STATE.area=k; render(); }
function openFlow(i){ state.tab="tools"; state.view={type:"flow",i}; render(); window.scrollTo(0,0); }
function screenFlow(i){
  const f=window.TOOL_FLOWS[i], a=window.TOOL_AREAS.find(x=>x.key===f[1]);
  return `<button class="back" onclick="closeView()">‹ Tools, ${a.label}</button>
  <h1>${esc(f[0])}</h1>
  <div class="row" style="gap:8px"><span class="pill">${mins(f[3])} min</span><span class="pill grey">${a.label}</span></div>
  <p class="lead" style="margin-top:12px">${esc(f[2])}</p>
  <button class="btn" style="margin-top:16px" onclick="play(${i})">Begin, guided</button>
  <div class="section-h"><h3>The steps</h3></div>
  ${f[3].map((m,j)=>`<div class="ex"><div class="num">${j+1}</div><div class="grow"><div class="row between" style="align-items:flex-start"><div class="title">${esc(m[0])}${m[2]?`, <span style="color:var(--muted);font-weight:500">${esc(m[2])}</span>`:""}</div><div class="dose">${m[1]}s</div></div><div class="why">${esc(m[3])}</div></div></div>`).join("")}
  <p class="install" style="margin-top:14px">Nothing here is programmed or logged, so there are no streaks and no record of use. Use it whenever it helps.</p>`;
}
let PL=null;
function play(i){
  const f=window.TOOL_FLOWS[i]; PL={i,step:0,left:f[3][0][1],paused:false};
  const div=document.createElement("div"); div.id="player"; div.className="player fade"; document.body.appendChild(div);
  drawPlayer(); PL.timer=setInterval(()=>{ if(PL.paused) return; PL.left--; if(PL.left<=0){ nextStep(); } else drawPlayer(); },1000);
}
function nextStep(){ const f=window.TOOL_FLOWS[PL.i]; PL.step++; if(PL.step>=f[3].length){ clearInterval(PL.timer); drawDone(); return; } PL.left=f[3][PL.step][1]; drawPlayer(); }
function drawPlayer(){
  const f=window.TOOL_FLOWS[PL.i], m=f[3][PL.step], tot=m[1], frac=PL.left/tot, C=2*Math.PI*96;
  const nxt=f[3][PL.step+1];
  $("#player").innerHTML=`<div class="row between"><span class="eyebrow">${esc(f[0])}</span><button class="chip" onclick="stopPlay()">Close</button></div>
  <div class="steps">${f[3].map((_,j)=>`<i class="${j<PL.step?"d":""}"></i>`).join("")}</div>
  <div class="ring"><svg width="210" height="210"><circle cx="105" cy="105" r="96" stroke="#3a2a1d" stroke-width="8" fill="none"/><circle cx="105" cy="105" r="96" stroke="#f7931e" stroke-width="8" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-frac)}" style="transition:stroke-dashoffset 1s linear"/></svg><div class="t">${Math.floor(PL.left/60)}:${String(PL.left%60).padStart(2,"0")}</div></div>
  <div style="text-align:center"><div class="sub" style="margin:0 0 4px">Step ${PL.step+1} of ${f[3].length}</div><h1 style="margin:0">${esc(m[0])}${m[2]?`, ${esc(m[2])}`:""}</h1><p class="lead" style="margin-top:10px;font-size:16px">${esc(m[3])}</p></div>
  ${nxt?`<p class="sub" style="text-align:center;margin-top:18px">Next: ${esc(nxt[0])}${nxt[2]?`, ${esc(nxt[2])}`:""}</p>`:""}
  <div class="ctrls"><button class="btn ghost" onclick="PL.paused=!PL.paused;drawPlayer()">${PL.paused?"Resume":"Pause"}</button><button class="btn ghost" onclick="nextStep()">Skip</button></div>`;
}
function drawDone(){
  $("#player").innerHTML=`<div style="margin:auto 0;text-align:center"><h1>Finished</h1><p class="lead" style="margin-top:10px">Take a moment to notice what has changed since you started, in the body, the breath or your attention.</p></div><button class="btn" onclick="stopPlay()">Back to Tools</button>`;
}
function stopPlay(){ if(PL) clearInterval(PL.timer); PL=null; const p=$("#player"); if(p) p.remove(); }

/* ===== Actions ===== */
function go(t){ state.tab=t; state.view=null; render(); window.scrollTo(0,0); }
function openDay(d){ state.tab = state.tab==="today"?"today":"programme"; state.view={type:"day",d}; render(); window.scrollTo(0,0); }
function openDomain(k){ state.tab="passport"; state.view={type:"domain",k}; render(); window.scrollTo(0,0); }
function openMarker(id){ state.view={type:"marker",id,prev:state.view}; render(); window.scrollTo(0,0); }
function closeView(){ state.view = state.view && state.view.prev ? state.view.prev : null; render(); window.scrollTo(0,0); }
function toggleEx(key){ state.done[key]=!state.done[key]; render(); }
function finishDay(d){
  state.done[d]=true; sheet(`<h2>Practice recorded</h2><p class="lead" style="margin-top:8px">Thank you. This is added to your record so your care team can see how the week is landing, and nothing more is needed from you today.</p><button class="btn" style="margin-top:18px" onclick="closeSheet();go('today')">Back to today</button>`);
}
function notice(key,name){
  const opts=["Felt easy and controlled","About right, worked","Hard to finish","Not sure I was getting it right","I did not understand the instruction","Not sure a sensation was OK"];
  sheet(`<h2>What did you notice?</h2><p class="lead" style="margin-top:6px">${name}. This is optional, and it helps your care team adjust the programme around you.</p>
  <div class="mini" style="margin-top:14px">${opts.map(o=>`<button class="chip" onclick="pickNotice('${key}','${o}')">${o}</button>`).join("")}</div>`);
}
function pickNotice(key,o){
  state.noticed[key]=o; let msg="Noted. Your care team will see this alongside the rest of today's practice.";
  if(o==="Not sure I was getting it right") msg="That is a good sign. It means you were feeling the movement rather than just completing it. Tell Dr David Silver PhD what felt uncertain and it becomes useful information.";
  if(o==="I did not understand the instruction"||o==="Not sure a sensation was OK") msg="Thank you for flagging it. You can ask your care team about this straight away, and they will come back to you before your next practice.";
  sheet(`<h2>Noted</h2><p class="lead" style="margin-top:8px">${msg}</p>${o.startsWith("I did")||o.startsWith("Not sure a")?'<button class="btn" style="margin-top:16px" onclick="closeSheet()">Ask a question</button>':""}<button class="btn ghost" style="margin-top:10px" onclick="closeSheet()">Done</button>`);
  render();
}
function video(v,name){
  const [id,h]=v.split("/"); const src=`https://player.vimeo.com/video/${id}?${h?"h="+h+"&":""}title=0&byline=0&portrait=0&dnt=1`;
  sheet(`<h2 style="font-size:17px">${name}</h2><div class="video"><iframe src="${src}" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe></div><button class="btn ghost" onclick="closeSheet()">Close</button>`);
}
function sheet(html){ $("#sheet").innerHTML=`<div class="sheet-bg" onclick="if(event.target===this)closeSheet()"><div class="sheet fade">${html}</div></div>`; }
function closeSheet(){ $("#sheet").innerHTML=""; }

const ICONS={
 today:'<svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
 programme:'<svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>',
 tools:'<svg viewBox="0 0 24 24"><path d="M12 2.8 19.8 7.3v9.4L12 21.2 4.2 16.7V7.3z"/><circle cx="12" cy="12" r="3"/></svg>',
 passport:'<svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="m8 14 3-3 2 2 3-4"/></svg>',
 me:'<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>'
};
function render(){
  let html;
  const v=state.view;
  if(v&&v.type==="day") html=screenDay(v.d);
  else if(v&&v.type==="domain") html=screenDomain(v.k);
  else if(v&&v.type==="marker") html=screenMarker(v.id);
  else if(v&&v.type==="flow") html=screenFlow(v.i);
  else html={today:screenToday,programme:screenProgramme,tools:screenTools,passport:screenPassport,me:screenMe}[state.tab]();
  $("#app").innerHTML=`<div class="fade">${html}</div>`;
  $("#tabs").innerHTML=[["today","Today"],["programme","Programme"],["tools","Tools"],["passport","Passport"],["me","Me"]].map(([k,l])=>`<button class="tab ${state.tab===k?"on":""}" onclick="go('${k}')">${ICONS[k]}${l}</button>`).join("");
}
render();
setTimeout(()=>{const l=$("#loader"); l.style.opacity=0; setTimeout(()=>l.remove(),500);},1700);
if("serviceWorker" in navigator){ window.addEventListener("load",()=>navigator.serviceWorker.register("/roam-demo/sw.js",{scope:"/roam-demo/"}).catch(()=>{})); }
</script>
